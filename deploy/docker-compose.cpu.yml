name: deploy

# ══════════════════════════════════════════════════════════════════
# OpenScience CPU-only — Docker Compose (host network)
# ══════════════════════════════════════════════════════════════════
#
# 适用于：无 GPU、宿主机 iptables FORWARD 受限（无法使用 Docker NAT 端口映射）。
# 使用 host 网络模式，容器直接监听宿主机网卡，绕过 Docker NAT。
#
# 使用方法：
#   1. 生成密钥
#      python3 -c "import secrets; print(secrets.token_urlsafe(48))"  # → JWT_SECRET
#      python3 -c "import secrets; print(secrets.token_urlsafe(32))"  # → API_KEY
#      python3 -c "from hashlib import sha256; print(sha256(b'你的API_KEY').hexdigest())"  # → API_KEY_HASHES
#
#   2. 编辑本文件，把 <CHANGE_ME> 替换为上面生成的值
#
#   3. 构建并启动同一个 release
#      bash deploy/release-production.sh
#
#   4. 查看日志
#      docker compose -f docker-compose.cpu.yml logs -f ainrf
#
#   5. 首次启动后获取 admin 密码
#      docker compose -f docker-compose.cpu.yml exec ainrf cat /opt/ainrf/state/admin_initial_password.txt
#
#   6. 访问
#      http://<宿主机IP>:8192/
#
# ══════════════════════════════════════════════════════════════════

services:
  ainrf:
    image: ${OPENSCIENCE_API_IMAGE:?Set OPENSCIENCE_API_IMAGE to an immutable release image}
    restart: unless-stopped
    container_name: ainrf
    network_mode: host
    environment:
      AINRF_PRODUCTION: "1"
      AINRF_HOST: "127.0.0.1"
      AINRF_PORT: "18000"
      # Current domain writes require the immutable artifact SHA.
      AINRF_DOMAIN_ARTIFACT_SHA: ${AINRF_DOMAIN_ARTIFACT_SHA:-}
      # ── 必填：在 .env 文件中设置（见 deploy/examples/ainrf.env.example）──
      AINRF_JWT_SECRET: ${AINRF_JWT_SECRET:?在 .env 中设置 AINRF_JWT_SECRET}
      AINRF_API_KEY_HASHES: ${AINRF_API_KEY_HASHES:?在 .env 中设置 AINRF_API_KEY_HASHES}
      # ── 安全 ────────────────────────────────────────────
      AINRF_PUBLIC_REGISTRATION_ENABLED: ${AINRF_PUBLIC_REGISTRATION_ENABLED:-false}
      AINRF_LOGIN_MAX_FAILURES: "10"
      AINRF_LOGIN_LOCKOUT_HOURS: "24"
      AINRF_MAX_CONCURRENT_REQUESTS: "100"
      AINRF_METRICS_ENABLED: "true"
      # ── Monitoring / observability dashboard links (browser-facing) ──
      # Defaults are relative paths that work through nginx on port 8192.
      # Set to a fully-qualified URL if services are accessed externally.
      # Set to "" (empty) to hide a service card in the frontend.
      AINRF_MONITORING_GRAFANA_URL: ${AINRF_MONITORING_GRAFANA_URL:-/grafana}
      AINRF_MONITORING_PROMETHEUS_URL: ${AINRF_MONITORING_PROMETHEUS_URL:-/prometheus}
      AINRF_MONITORING_LITEFUSE_URL: ${AINRF_MONITORING_LITEFUSE_URL:-/litefuse/}
      # ── LLM Observability (Litefuse overlay, disabled by default) ──
      AINRF_OBSERVABILITY_ENABLED: ${AINRF_OBSERVABILITY_ENABLED:-false}
      AINRF_OBSERVABILITY_BASE_URL: ${AINRF_OBSERVABILITY_BASE_URL:-http://localhost:13000}
      AINRF_OBSERVABILITY_SECRET_KEY: ${AINRF_OBSERVABILITY_SECRET_KEY:-}
      AINRF_OBSERVABILITY_PUBLIC_KEY: ${AINRF_OBSERVABILITY_PUBLIC_KEY:-}
      # ── Agent 工具配置（在 .env 中设置）──
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_BASE_URL: ${CODEX_BASE_URL:-https://api.openai.com/v1}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.5}
    volumes:
      - ainrf-state:/opt/ainrf/state
      - ainrf-workspaces:/opt/ainrf/.ainrf_workspaces
      - ainrf-tenants:/home/ainrf_tenants
    cap_add:
      - SYS_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18000/api/health')"]
      interval: 30s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # The historical profile name is retained for the current domain worker:
  #   docker compose --profile domain-v2 -f deploy/docker-compose.cpu.yml up -d
  # It has no HTTP port and shares every durable state/tenant mount with the
  # API process.  Host networking uses the API container's sshd, so its own
  # entrypoint must not bind the same port.
  domain-worker:
    profiles: ["domain-v2"]
    image: ${OPENSCIENCE_API_IMAGE:?Set OPENSCIENCE_API_IMAGE to an immutable release image}
    restart: unless-stopped
    container_name: ainrf-domain-worker
    network_mode: host
    environment:
      HOME: /opt/ainrf
      AINRF_PRODUCTION: "1"
      AINRF_STATE_ROOT: /opt/ainrf/state
      AINRF_DOMAIN_ARTIFACT_SHA: ${AINRF_DOMAIN_ARTIFACT_SHA:-}
      AINRF_NO_SSHD: "1"
      AINRF_LITERATURE_REDIS_URL: redis://:${AINRF_LITERATURE_REDIS_PASSWORD:?Set AINRF_LITERATURE_REDIS_PASSWORD in .env}@127.0.0.1:16379/0
      AINRF_LITERATURE_REDIS_NAMESPACE: ainrf:production:literature
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_BASE_URL: ${CODEX_BASE_URL:-https://api.openai.com/v1}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.5}
    volumes:
      - ainrf-state:/opt/ainrf/state
      - ainrf-workspaces:/opt/ainrf/.ainrf_workspaces
      - ainrf-tenants:/home/ainrf_tenants
    cap_add:
      - SYS_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["openscience", "domain-worker", "--state-root", "/opt/ainrf/state"]
    healthcheck:
      disable: true
    depends_on:
      ainrf:
        condition: service_healthy
      literature-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  literature-redis:
    image: docker.1ms.run/redis:7-alpine
    restart: unless-stopped
    container_name: ainrf-literature-redis
    network_mode: host
    environment:
      AINRF_LITERATURE_REDIS_PASSWORD: ${AINRF_LITERATURE_REDIS_PASSWORD:?Set AINRF_LITERATURE_REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "16379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${AINRF_LITERATURE_REDIS_PASSWORD:?Set AINRF_LITERATURE_REDIS_PASSWORD in .env}
    volumes:
      - literature-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 16379 -a \"$$AINRF_LITERATURE_REDIS_PASSWORD\" ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  literature-worker:
    image: ${OPENSCIENCE_API_IMAGE:?Set OPENSCIENCE_API_IMAGE to an immutable release image}
    restart: unless-stopped
    container_name: ainrf-literature-worker
    network_mode: host
    environment:
      AINRF_STATE_ROOT: /opt/ainrf/state
      AINRF_LITERATURE_REDIS_URL: redis://:${AINRF_LITERATURE_REDIS_PASSWORD:?Set AINRF_LITERATURE_REDIS_PASSWORD in .env}@127.0.0.1:16379/0
      AINRF_LITERATURE_REDIS_NAMESPACE: ainrf:production:literature
      AINRF_LITERATURE_REQUEST_INTERVAL_SECONDS: "3"
      AINRF_LITERATURE_DAILY_SOURCE_BUDGET: "24"
      AINRF_LITERATURE_DAILY_SEARCH_BUDGET: "8"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    volumes:
      - ainrf-state:/opt/ainrf/state
    command: ["python", "-m", "dramatiq", "ainrf.literature.tasks", "--processes", "1", "--threads", "2"]
    healthcheck:
      disable: true
    depends_on:
      ainrf:
        condition: service_healthy
      literature-redis:
        condition: service_healthy

  prometheus:
    image: ${OPENSCIENCE_PROMETHEUS_IMAGE:?Set OPENSCIENCE_PROMETHEUS_IMAGE to an immutable release image}
    restart: unless-stopped
    container_name: ainrf-prometheus
    network_mode: host
    volumes:
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.listen-address=127.0.0.1:9091"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/prometheus"
    depends_on:
      ainrf:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: ${OPENSCIENCE_GRAFANA_IMAGE:?Set OPENSCIENCE_GRAFANA_IMAGE to an immutable release image}
    restart: unless-stopped
    container_name: ainrf-grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ainrf-grafana}
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "${AINRF_GRAFANA_ROOT_URL:-http://157.255.30.82:8192/grafana}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gatus:
    image: ${OPENSCIENCE_GATUS_IMAGE:?Set OPENSCIENCE_GATUS_IMAGE to an immutable release image}
    restart: unless-stopped
    container_name: ainrf-gatus
    network_mode: host
    environment:
      GATUS_WEB_ADDRESS: "127.0.0.1"
      GATUS_WEB_PORT: "8080"
      GATUS_PRODUCTION_WEB_URL: ${GATUS_PRODUCTION_WEB_URL:-http://127.0.0.1:8192/}
      GATUS_PRODUCTION_HEALTH_URL: ${GATUS_PRODUCTION_HEALTH_URL:-http://127.0.0.1:8192/api/health}
      GATUS_PRODUCTION_SSH_ENABLED: ${GATUS_PRODUCTION_SSH_ENABLED:-true}
      GATUS_PRODUCTION_MONITORING_ENABLED: ${GATUS_PRODUCTION_MONITORING_ENABLED:-true}
      GATUS_PRODUCTION_WORKER_ENABLED: ${GATUS_PRODUCTION_WORKER_ENABLED:-true}
      GATUS_PRODUCTION_PROMETHEUS_READY_URL: ${GATUS_PRODUCTION_PROMETHEUS_READY_URL:-http://127.0.0.1:9091/prometheus/-/ready}
      GATUS_PRODUCTION_GRAFANA_HEALTH_URL: ${GATUS_PRODUCTION_GRAFANA_HEALTH_URL:-http://127.0.0.1:3000/grafana/api/health}
      GATUS_PRODUCTION_WORKER_QUERY_URL: ${GATUS_PRODUCTION_WORKER_QUERY_URL:-http://127.0.0.1:9091/prometheus/api/v1/query?query=%28up%7Bjob%3D%22ainrf%22%7D%20%3D%3D%201%29%20and%20on%28job%2Cinstance%29%20%28ainrf_domain_metrics_scrape_success%20%3D%3D%201%29%20and%20on%28job%2Cinstance%29%20%28ainrf_domain_turn_submission_oldest_pending_age_seconds%20%3C%20300%29%20and%20on%28job%2Cinstance%29%20%28ainrf_domain_metrics_risk_state_known%20%3D%3D%201%29}
      GATUS_STAGING_WEB_URL: ${GATUS_STAGING_WEB_URL:-http://127.0.0.1:7192/}
      GATUS_STAGING_HEALTH_URL: ${GATUS_STAGING_HEALTH_URL:-http://127.0.0.1:7192/api/health}
      GATUS_STAGING_SSH_ENABLED: ${GATUS_STAGING_SSH_ENABLED:-false}
      GATUS_STAGING_MONITORING_ENABLED: ${GATUS_STAGING_MONITORING_ENABLED:-true}
      GATUS_STAGING_WORKER_ENABLED: ${GATUS_STAGING_WORKER_ENABLED:-true}
      GATUS_STAGING_PROMETHEUS_READY_URL: ${GATUS_STAGING_PROMETHEUS_READY_URL:-http://127.0.0.1:9092/prometheus/-/ready}
      GATUS_STAGING_GRAFANA_HEALTH_URL: ${GATUS_STAGING_GRAFANA_HEALTH_URL:-http://127.0.0.1:2300/grafana/api/health}
      GATUS_STAGING_WORKER_QUERY_URL: ${GATUS_STAGING_WORKER_QUERY_URL:-http://127.0.0.1:9092/prometheus/api/v1/query?query=%28up%7Bjob%3D%22ainrf-staging%22%7D%20%3D%3D%201%29%20and%20on%28job%2Cinstance%29%20%28ainrf_domain_metrics_scrape_success%20%3D%3D%201%29%20and%20on%28job%2Cinstance%29%20%28ainrf_domain_turn_submission_oldest_pending_age_seconds%20%3C%20300%29%20and%20on%28job%2Cinstance%29%20%28ainrf_domain_metrics_risk_state_known%20%3D%3D%201%29}
      GATUS_DEVELOPMENT_ENABLED: ${GATUS_DEVELOPMENT_ENABLED:-false}
      GATUS_DEVELOPMENT_WEB_URL: ${GATUS_DEVELOPMENT_WEB_URL:-http://127.0.0.1:41000/}
      GATUS_DEVELOPMENT_HEALTH_URL: ${GATUS_DEVELOPMENT_HEALTH_URL:-http://127.0.0.1:41001/api/health}
      GATUS_DEVELOPMENT_SSH_ENABLED: ${GATUS_DEVELOPMENT_SSH_ENABLED:-false}
      GATUS_DEVELOPMENT_MONITORING_ENABLED: ${GATUS_DEVELOPMENT_MONITORING_ENABLED:-false}
      GATUS_DEVELOPMENT_WORKER_ENABLED: ${GATUS_DEVELOPMENT_WORKER_ENABLED:-false}
      GATUS_DEVELOPMENT_PROMETHEUS_READY_URL: ${GATUS_DEVELOPMENT_PROMETHEUS_READY_URL:-http://127.0.0.1:41991/-/ready}
      GATUS_DEVELOPMENT_GRAFANA_HEALTH_URL: ${GATUS_DEVELOPMENT_GRAFANA_HEALTH_URL:-http://127.0.0.1:41992/api/health}
      GATUS_DEVELOPMENT_WORKER_QUERY_URL: ${GATUS_DEVELOPMENT_WORKER_QUERY_URL:-http://127.0.0.1:41991/api/v1/query?query=vector%281%29}
    volumes:
      - gatus-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${OPENSCIENCE_WEB_IMAGE:?Set OPENSCIENCE_WEB_IMAGE to an immutable release image}
    restart: unless-stopped
    container_name: ainrf-nginx
    network_mode: host
    environment:
      AINRF_WEB_PORT: "8192"
      AINRF_BACKEND_PORT: "18000"
      AINRF_GRAFANA_PORT: "3000"
      AINRF_PROMETHEUS_PORT: "9091"
      AINRF_LITEFUSE_PORT: "13000"
      AINRF_GATUS_PORT: "8080"
    depends_on:
      ainrf:
        condition: service_healthy
      gatus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8192/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ainrf-state:
  ainrf-workspaces:
  ainrf-tenants:
  prometheus-data:
  grafana-data:
  gatus-data:
  literature-redis-data:
