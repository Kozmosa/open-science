metrics: true

web:
  address: ${GATUS_WEB_ADDRESS}
  port: ${GATUS_WEB_PORT}

storage:
  type: sqlite
  path: /data/gatus.db
  caching: true
  maximum-number-of-results: 1000
  maximum-number-of-events: 100

ui:
  title: OpenScience Status
  description: OpenScience service availability
  header: OpenScience
  dashboard-heading: System Status
  dashboard-subheading: Availability across production, staging, and development
  login-subtitle: OpenScience service availability
  logo: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cpath d="M40.7 12.1A23.8 23.8 0 1 0 52 31.8" fill="none" stroke="%232563eb" stroke-linecap="round" stroke-width="7.2"/%3E%3Ccircle cx="51.8" cy="12.2" r="5.1" fill="%232563eb"/%3E%3C/svg%3E'
  link: /
  dark-mode: true
  default-sort-by: group
  default-filter-by: none
  buttons:
    - name: OpenScience
      link: /
  custom-css: |
    :root {
      --background: 220 20% 98%;
      --foreground: 224 28% 13%;
      --card: 0 0% 100%;
      --card-foreground: 224 28% 13%;
      --popover: 0 0% 100%;
      --popover-foreground: 224 28% 13%;
      --primary: 221 83% 53%;
      --primary-foreground: 0 0% 100%;
      --secondary: 220 18% 95%;
      --secondary-foreground: 224 24% 18%;
      --muted: 220 18% 95%;
      --muted-foreground: 220 9% 43%;
      --accent: 219 100% 96%;
      --accent-foreground: 221 83% 45%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 0 0% 100%;
      --border: 220 15% 88%;
      --input: 220 15% 84%;
      --ring: 221 83% 53%;
      --radius: 0.75rem;
      --osci-surface-subtle: #f3f5f8;
      --osci-shadow-card: 0 1px 2px rgb(15 23 42 / 0.04), 0 8px 24px rgb(15 23 42 / 0.05);
      --osci-shadow-float: 0 12px 36px rgb(15 23 42 / 0.14);
    }

    .dark {
      --background: 240 4% 6%;
      --foreground: 220 14% 93%;
      --card: 240 4% 9%;
      --card-foreground: 220 14% 93%;
      --popover: 240 4% 10%;
      --popover-foreground: 220 14% 93%;
      --primary: 217 91% 60%;
      --primary-foreground: 222 47% 11%;
      --secondary: 240 4% 13%;
      --secondary-foreground: 220 14% 90%;
      --muted: 240 4% 13%;
      --muted-foreground: 220 8% 61%;
      --accent: 221 39% 16%;
      --accent-foreground: 214 95% 76%;
      --destructive: 0 63% 48%;
      --destructive-foreground: 0 0% 100%;
      --border: 240 4% 18%;
      --input: 240 4% 22%;
      --ring: 217 91% 60%;
      --osci-surface-subtle: #141416;
      --osci-shadow-card: 0 1px 2px rgb(0 0 0 / 0.22), 0 10px 30px rgb(0 0 0 / 0.18);
      --osci-shadow-float: 0 16px 42px rgb(0 0 0 / 0.42);
    }

    html {
      background: hsl(var(--background));
    }

    body {
      min-width: 320px;
      font-family: Inter, "Noto Sans", "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      letter-spacing: -0.01em;
      background:
        radial-gradient(circle at 50% -16rem, rgb(37 99 235 / 0.09), transparent 32rem),
        hsl(var(--background));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      border-color: hsl(var(--border) / 0.72) !important;
      background: hsl(var(--card) / 0.82) !important;
      box-shadow: 0 1px 0 rgb(15 23 42 / 0.03);
    }

    header > .container,
    main .container,
    footer .container {
      max-width: 1180px !important;
    }

    header > .container {
      padding-top: 0.65rem !important;
      padding-bottom: 0.65rem !important;
    }

    header img[alt="Gatus"] {
      width: 2rem !important;
      height: 2rem !important;
    }

    header .w-12.h-12 {
      width: 2.25rem !important;
      height: 2.25rem !important;
    }

    header h1 {
      font-size: 1rem !important;
      font-weight: 650 !important;
      letter-spacing: -0.025em !important;
    }

    header h1 + p {
      display: none !important;
    }

    header a,
    header button {
      border-radius: 0.625rem !important;
    }

    header .flex.items-center.gap-2 > a {
      padding: 0.45rem 0.75rem !important;
      border: 1px solid hsl(var(--border));
      color: hsl(var(--foreground)) !important;
      background: hsl(var(--card) / 0.72);
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
    }

    header .flex.items-center.gap-2 > a:hover {
      border-color: hsl(var(--primary) / 0.42);
      color: hsl(var(--primary)) !important;
      background: hsl(var(--accent));
    }

    .dashboard-container > .container {
      padding-top: 2.5rem !important;
      padding-bottom: 4.5rem !important;
    }

    main .mb-6 > .flex.items-center.justify-between.mb-6 h1 {
      font-size: clamp(1.9rem, 4vw, 2.65rem) !important;
      font-weight: 680 !important;
      line-height: 1.08 !important;
      letter-spacing: -0.045em !important;
    }

    main .mb-6 > .flex.items-center.justify-between.mb-6 p {
      margin-top: 0.65rem !important;
      font-size: 0.925rem !important;
      line-height: 1.6 !important;
    }

    main .mb-6 > .flex.flex-col {
      border-color: hsl(var(--border) / 0.82) !important;
      border-radius: 0.875rem !important;
      background: hsl(var(--card) / 0.82) !important;
      box-shadow: var(--osci-shadow-card);
      backdrop-filter: blur(14px);
    }

    input,
    button[role="combobox"] {
      border-radius: 0.625rem !important;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid hsl(var(--ring)) !important;
      outline-offset: 2px !important;
    }

    .space-y-6 {
      row-gap: 1rem !important;
    }

    .endpoint-group {
      overflow: clip !important;
      border-color: hsl(var(--border) / 0.9) !important;
      border-radius: 1rem !important;
      background: hsl(var(--card)) !important;
      box-shadow: var(--osci-shadow-card);
    }

    .endpoint-group-header {
      min-height: 4.25rem;
      padding: 1rem 1.15rem !important;
      border-color: hsl(var(--border) / 0.72) !important;
      background: linear-gradient(135deg, hsl(var(--card)), hsl(var(--accent) / 0.32)) !important;
    }

    .endpoint-group-header:hover {
      background: hsl(var(--accent) / 0.72) !important;
    }

    .endpoint-group-header h2 {
      font-size: 1rem !important;
      font-weight: 650 !important;
      letter-spacing: -0.02em !important;
    }

    .endpoint-group-header span.rounded-full {
      min-width: 1.75rem;
      padding: 0.2rem 0.55rem !important;
      border: 1px solid rgb(255 255 255 / 0.14);
      font-size: 0.75rem !important;
      text-align: center;
      box-shadow: none !important;
    }

    .endpoint-group-content {
      padding: 0.9rem !important;
      background: var(--osci-surface-subtle);
    }

    .endpoint {
      border-color: hsl(var(--border) / 0.88) !important;
      border-radius: 0.875rem !important;
      box-shadow: none !important;
      transform: none !important;
    }

    .endpoint:hover {
      border-color: hsl(var(--primary) / 0.42) !important;
      box-shadow: 0 10px 28px rgb(37 99 235 / 0.09) !important;
      transform: translateY(-1px) !important;
    }

    .endpoint-header,
    .endpoint-content {
      padding-left: 1rem !important;
      padding-right: 1rem !important;
    }

    .endpoint-header h3 {
      font-weight: 650 !important;
      letter-spacing: -0.02em !important;
    }

    .endpoint .rounded-full {
      border-radius: 999px !important;
      box-shadow: none !important;
    }

    .fixed.bottom-4.left-4 > div {
      border-color: hsl(var(--border) / 0.85) !important;
      background: hsl(var(--card) / 0.9) !important;
      box-shadow: var(--osci-shadow-float) !important;
    }

    footer {
      border-color: hsl(var(--border) / 0.72) !important;
      background: hsl(var(--card) / 0.38);
    }

    footer .container {
      padding-top: 1.1rem !important;
      padding-bottom: 1.1rem !important;
    }

    footer a {
      color: hsl(var(--muted-foreground)) !important;
    }

    @media (max-width: 640px) {
      .dashboard-container > .container {
        padding-top: 1.5rem !important;
        padding-bottom: 5rem !important;
      }

      main .mb-6 > .flex.items-center.justify-between.mb-6 {
        align-items: flex-start !important;
        gap: 0.75rem;
      }

      .endpoint-group-header {
        min-height: 3.75rem;
        padding: 0.85rem 0.9rem !important;
      }

      .endpoint-group-content {
        padding: 0.65rem !important;
      }
    }

endpoints:
  - name: API
    group: Production
    url: ${GATUS_PRODUCTION_HEALTH_URL}
    interval: 30s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 5000"
    ui:
      hide-url: true
      hide-hostname: true
    extra-labels:
      environment: production

  - name: API
    group: Staging
    url: ${GATUS_STAGING_HEALTH_URL}
    interval: 30s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 5000"
    ui:
      hide-url: true
      hide-hostname: true
    extra-labels:
      environment: staging

  - name: API
    group: Development
    enabled: ${GATUS_DEVELOPMENT_ENABLED}
    url: ${GATUS_DEVELOPMENT_HEALTH_URL}
    interval: 30s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 5000"
    ui:
      hide-url: true
      hide-hostname: true
    extra-labels:
      environment: development
